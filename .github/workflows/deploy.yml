name: deploy

on:
  push:
    branches: [main]
  pull_request:
  # Disparo manual, para exercitar o rollback do canary (T096) sem precisar de código ruim.
  workflow_dispatch:
    inputs:
      forcar_falha_gate:
        description: Reprovar o primeiro gate do canary (testa o rollback)
        type: boolean
        default: false

env:
  # Variáveis de repositório (Settings → Secrets and variables → Actions → Variables),
  # não segredo — configuradas por quem faz fork do projeto pra própria conta GCP.
  # Ver infra/README.md.
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  ARTIFACT_REPO: ai-researcher
  CLOUD_RUN_SERVICE: ai-researcher-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      # E2E (CA-12): a API sobe em DEMO=true (sem banco, Vertex AI nem rede) e o Angular em
      # ng serve; o Playwright dirige um Chromium de verdade contra os dois.
      - name: Instala o Chromium do Playwright
        run: pnpm --filter @hero/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Um deploy de produção por vez: o segundo espera o primeiro terminar (nunca cancela no meio
    # de um canary, que deixaria o tráfego dividido entre duas revisões).
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build e push da imagem da API
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker build \
            -f infra/docker/api.Dockerfile \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:${{ github.sha }} \
            .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:${{ github.sha }}

      # Anotada antes do deploy: é para esta revisão que o rollback devolve o tráfego.
      - name: Revisão estável
        id: estavel
        env:
          SERVICE: ${{ env.CLOUD_RUN_SERVICE }}
        run: echo "revisao=$(bash scripts/canary.sh estavel)" >> "$GITHUB_OUTPUT"

      # A candidata nasce sem tráfego e com a tag "candidata", que lhe dá uma URL própria
      # para o smoke antes de qualquer usuário chegar nela.
      - name: Deploy da candidata no Cloud Run (sem tráfego)
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          no_traffic: true
          tag: candidata
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:${{ github.sha }}
          # Configuração do agente. Modelo nunca é hardcoded no código: muda aqui, sem build.
          # Limites (RATE_LIMIT_*, DAILY_TOKEN_BUDGET) e MCP_GATEWAY ficam nos padrões do código.
          env_vars: |-
            MODEL_GRADE=gemini-3.5-flash-lite
            MODEL_ANSWER=gemini-3.6-flash
            MODEL_EMBEDDING=gemini-embedding-001
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=global
            SEARCH_PROVIDER=serper
          # Segredos vêm do Secret Manager; nada disto passa pelo GitHub.
          secrets: |-
            DATABASE_URL=database-url:latest
            SERPER_API_KEY=serper-api-key:latest
          flags: --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:ai-researcher-db

      # Smoke na URL da candidata e promoção 5 → 25 → 50 → 100%, com gate em cada degrau.
      # Reprovou: 100% volta para a revisão estável e o job falha antes do frontend.
      - name: Canary da API
        env:
          SERVICE: ${{ env.CLOUD_RUN_SERVICE }}
          FORCAR_FALHA_GATE: ${{ inputs.forcar_falha_gate || false }}
        run: bash scripts/canary.sh promover "${{ steps.estavel.outputs.revisao }}"

      # O frontend só sai depois que o backend novo está com 100% do tráfego.
      - name: Build do Angular
        run: pnpm turbo run build --filter=@hero/web

      - name: Deploy no Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project ${{ env.PROJECT_ID }} --non-interactive
